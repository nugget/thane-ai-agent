version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
  # Hermetic dev tools (golangci-lint, vacuum) are pinned in tools/go.mod via
  # the Go tool directive. The directive records their module requirements as
  # indirect, so allow the tools by name without independently upgrading their
  # transitive dependencies, whose internal APIs must stay compatible.
  - package-ecosystem: gomod
    directory: /tools
    schedule:
      interval: weekly
    allow:
      - dependency-name: github.com/daveshanley/vacuum
      - dependency-name: github.com/golangci/golangci-lint/v2
    commit-message:
      prefix: "chore"
  # go-check-sumtype 0.5+ exposes a native go/analysis analyzer that is not
  # source-compatible with golangci-lint's embedded pre-0.5 adapter. Track and
  # run it from an isolated module so each tool keeps a coherent module graph.
  - package-ecosystem: gomod
    directory: /tools/gochecksumtype
    schedule:
      interval: weekly
    allow:
      - dependency-name: github.com/alecthomas/go-check-sumtype
    commit-message:
      prefix: "chore"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
